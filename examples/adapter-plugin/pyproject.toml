[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hiveswarm-adapter-example"
version = "0.1.0"
description = "Example Hiveswarm agent adapter: drives any CLI that takes a prompt as its argument"
requires-python = ">=3.11"
dependencies = ["hiveswarm"]

[project.entry-points."hiveswarm.adapters"]
example = "hiveswarm_adapter_example:example"

[tool.hatch.build.targets.wheel]
packages = ["hiveswarm_adapter_example"]
