name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl

  desktop:
    needs: wheel
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: ubuntu-latest
            args: --linux
          - os: macos-latest
            args: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist
      - run: npm ci
        working-directory: desktop
      - run: npm test
        working-directory: desktop
      - run: npx electron-builder ${{ matrix.args }} --publish never
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            desktop/release/*.exe
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/*.dmg
          if-no-files-found: error

  release:
    needs: [wheel, desktop]
    if: ${{ !cancelled() && needs.wheel.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: collect
        run: |
          mkdir -p out
          find artifacts -type f \( -name '*.whl' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.dmg' \) -exec cp {} out/ \;
          [ "$(find out \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' \) | wc -l)" -gt 0 ] || { echo "no desktop build succeeded"; exit 1; }
          {
            echo "**Hiveswarm Desktop**: download the installer for your machine and open it. It installs the engine on first run (into WSL2 on Windows)."
            echo "- Windows: \`Hiveswarm-Setup-<version>-win-x64.exe\` (installer) or \`Hiveswarm-<version>-win-x64-portable.exe\`"
            echo "- macOS: \`Hiveswarm-<version>-mac-arm64.dmg\` (Apple silicon) or \`-mac-x64.dmg\` (Intel); unsigned, so right-click → Open the first time"
            echo "- Linux: \`.AppImage\` or \`.deb\`"
            echo
            echo "**Engine only** (a hub, a server, or the CLI without the desktop app): \`pip install hiveswarm-<version>-py3-none-any.whl\`."
            ls out/*.exe >/dev/null 2>&1 || echo "- ⚠️ The Windows build failed for this release; see the workflow run."
            ls out/*.dmg >/dev/null 2>&1 || echo "- ⚠️ The macOS build failed for this release; see the workflow run."
            ls out/*.AppImage >/dev/null 2>&1 || echo "- ⚠️ The Linux build failed for this release; see the workflow run."
          } > notes.md
          cd out && sha256sum * > SHA256SUMS.txt && ls -la
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          body_path: notes.md
