name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src tests examples

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: pip install -e '.[dev]'
      - run: pytest -q -m "not e2e" --timeout 300
      - name: stack log on failure
        if: failure()
        run: find /tmp -name stack.log -exec tail -n 200 {} \; 2>/dev/null || true

  webapp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - run: npm ci
        working-directory: webapp
      - run: npm run build
        working-directory: webapp
      - name: packaged UI is current
        run: |
          diff <(cd webapp/dist && find . -type f ! -path './assets/*' | sort) <(cd src/hiveswarm/ui_dist && find . -type f ! -path './assets/*' | sort)
          test -f src/hiveswarm/ui_dist/index.html

  e2e:
    runs-on: ubuntu-latest
    needs: [test, webapp]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: pip install -e '.[dev]'
      - run: playwright install --with-deps chromium
      - run: pytest -q -m e2e --timeout 300

  desktop:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: pip install build && python -m build --wheel
      - run: npm ci
        working-directory: desktop
      - name: engine boots from the wheel (install, init, up, stop)
        run: HIVESWARM_WHEEL_DIR=$GITHUB_WORKSPACE/dist PATH=$GITHUB_WORKSPACE/tests/fakes:$PATH npm test
        working-directory: desktop
      - run: npx electron-builder --linux AppImage --publish never
        working-directory: desktop

  desktop-package:
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: macos-latest
            args: --mac dmg --arm64
          - os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: pip install build && python -m build --wheel
      - run: npm ci
        working-directory: desktop
      - run: npx electron-builder ${{ matrix.args }} --publish never
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

  package:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: fresh install smoke test
        run: |
          python -m venv /tmp/v && /tmp/v/bin/pip install -q dist/*.whl
          HIVESWARM_HOME=/tmp/hs /tmp/v/bin/hm init --project smoke
          /tmp/v/bin/hm --version
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
